# The suite, on every pull request, on the newest PHP with the newest
# dependencies and on the oldest PHP the manifest allows with the oldest
# dependencies Composer will resolve. A floor in composer.json is a promise
# about a machine nobody on this project runs, and the only thing that makes
# it true is a runner that is that machine.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            dependencies: highest
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring
          coverage: none

      - name: Check the manifest is well formed
        run: composer validate --strict

      # No composer.lock in this repository: this is a package an application
      # installs, so the application's lock is the one that matters.
      - name: Install dependencies
        if: matrix.dependencies == 'highest'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install the oldest dependencies the manifest allows
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run the suite
        run: ./vendor/bin/pest
